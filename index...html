<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BEOMII-SEAN</title>
<style>

@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#241a14;--sf:rgba(51,38,29,.88);--tx:#f3e8d6;--mu:#b9a58f;--ac:#d9a577;--ln:#4a3a2d}}
:root[data-theme=dark]{--bg:#241a14;--sf:rgba(51,38,29,.88);--tx:#f3e8d6;--mu:#b9a58f;--ac:#d9a577;--ln:#4a3a2d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Georgia,'Palatino Linotype',serif}
h1,h2,h3{font-weight:600;margin:.2em 0}button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
nav{background:var(--sf);border-right:1px solid var(--ln);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
nav b{display:block;font-size:19px;color:var(--ac);padding:4px 10px 12px}
nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:12px;cursor:pointer;margin:2px 0}
nav button:hover{background:var(--ln)}nav button.on{background:var(--sg);color:#2b3a22}
main{padding:20px;max-width:1250px;width:100%}
.card{backdrop-filter:blur(6px);background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;margin:0 0 14px}
main>h1,main>h2,main>p{background:var(--sf);display:inline-block;padding:2px 12px;border-radius:12px;backdrop-filter:blur(6px)}

.btn{background:var(--ac);color:#fff8ee;border:0;border-radius:12px;padding:9px 16px;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.94)}.btn.alt{background:var(--ln);color:var(--tx)}.btn:disabled{opacity:.5;cursor:not-allowed}
input,select{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mu{color:var(--mu);font-size:14px}.err{color:#b23b3b;font-size:14px;min-height:20px}

.it{position:absolute;font-size:34px;transform:translate(-50%,-50%);user-select:none}
.av{position:absolute;width:56px;transform:translate(-50%,-92%);transition:left 1.2s linear,top 1.2s linear;pointer-events:none}

.tag{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--sf);color:var(--tx);font-size:11px;padding:0 6px;border-radius:8px;white-space:nowrap}
@keyframes bob{50%{transform:translateY(-3px)}}
.fx{position:absolute;pointer-events:none}.rain{width:2px;height:16px;background:#cfe3f0;opacity:.7;animation:fall 1s linear infinite}
@keyframes fall{to{transform:translateY(340px)}}
.ff{width:6px;height:6px;border-radius:50%;background:#ffe9a0;box-shadow:0 0 8px #ffe9a0;animation:tw 2.5s ease-in-out infinite}

.wave{left:-10%;width:120%;height:30px;background:rgba(255,255,255,.35);border-radius:50%;animation:sw 4s ease-in-out infinite}
@keyframes sw{50%{transform:translateX(5%)}}
.rm *{animation:none!important;transition:none!important}
.timer{font-size:64px;text-align:center;letter-spacing:2px}
.chip{display:inline-block;padding:2px 10px;border-radius:20px;background:var(--pk);color:#4a2b2e;font-size:13px}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer}.sw.on{border-color:var(--tx)}
.opt{padding:6px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);cursor:pointer}.opt.on{background:var(--sg);color:#2b3a22}
.chart{display:flex;gap:8px;align-items:flex-end;height:120px}.chart div{flex:1;background:var(--sg);border-radius:6px 6px 0 0;min-height:2px;position:relative}
.chart span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--mu)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ac);color:#fff8ee;padding:10px 18px;border-radius:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
#toast.s{opacity:1}
@media(max-width:700px){.app{grid-template-columns:1fr}nav{position:fixed;bottom:0;top:auto;height:auto;width:100%;display:flex;overflow-x:auto;z-index:5;border-top:1px solid var(--ln);border-right:0;padding:6px}nav b{display:none}nav button{width:auto;white-space:nowrap}main{padding:14px 12px 80px}}

.hm{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;align-items:start}
.hr{position:sticky;top:14px}
.hl>h1,.hl>p{background:var(--sf);display:inline-block;padding:2px 12px;border-radius:12px;backdrop-filter:blur(6px)}
.clog{height:340px;overflow-y:auto;margin:8px 0;padding:8px;border-radius:10px;background:var(--bg);font-size:14px}
.clog div{margin-bottom:6px;word-wrap:break-word}
.rc{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center;margin-top:14px}
.rt{border-left:1px solid var(--ln);padding-left:16px}
@media(max-width:1000px){.hm{grid-template-columns:1fr}.hr{position:static}}
@media(max-width:600px){.rc{grid-template-columns:1fr}.rt{border-left:0;padding-left:0}}

#brk{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.phone{width:250px;height:440px;background:#111;border-radius:36px;padding:12px;box-shadow:0 10px 40px rgba(0,0,0,.6);position:relative}
.notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:80px;height:18px;background:#111;border-radius:0 0 12px 12px;z-index:2}
.scr{height:100%;border-radius:26px;background:linear-gradient(160deg,#f6c28b,#b07cc6 60%,#5a6fb5);color:#fff;text-align:center;padding:40px 16px 16px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.scr h3{margin:0;font-size:22px}.bt2{font-size:46px;font-weight:600}.brow{display:flex;gap:8px}
.av.phn:after{content:"\1F4F1";position:absolute;right:-8px;top:38px;font-size:16px}
</style></head><body>
<div id="root"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),R=$('#root');
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ===== SHARED SERVER (MockAPI, one row per member so devices never overwrite each other) ===== */
const SERVER=(()=>{try{let u=localStorage.getItem('bs_server')||'';if(!u){u=(prompt('Paste your shared server link (your friend can send it to you):')||'').trim().replace(/\/+$/,'');if(/^https:\/\//.test(u))localStorage.setItem('bs_server',u);else u=''}return u}catch(e){return ''}})();
let _last={},_busy=0,_ids={};
const _H={'Content-Type':'application/json'};
const cj=o=>JSON.stringify(o,(k,v)=>v&&typeof v=='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,b)=>(a[b]=v[b],a),{}):v);
async function pull(){
  if(!SERVER||_busy)return false;
  try{
    const r=await fetch(SERVER);const a=await r.json();
    if(!Array.isArray(a))return false;
    const d={},ids={},dup=[];
    a.forEach(x=>{let o;try{o=JSON.parse(x.data)}catch(e){return}
      if(!o||!o.k)return;const c=x.code;
      const key=o.k=='r'?c+'|r':o.k=='m'?c+'|m|'+o.u:c+'|c|'+o.u;
      if(ids[key]){dup.push(x.id);return}
      ids[key]=Promise.resolve(x.id);
      const R=d[c]=d[c]||{h:'',loc:'',lid:'',m:[],chat:[]};
      if(o.k=='r'){R.h=o.h;R.loc=o.loc;R.lid=o.lid}
      else if(o.k=='m')R.m.push(o.d);
      else R.chat=R.chat.concat(o.msgs||[]);
    });
    if(_busy)return false;
    _ids=ids;dup.forEach(id=>fetch(SERVER+'/'+id,{method:'DELETE'}).catch(()=>{}));
    for(const c in d){const R=d[c];if(!R.m.length){delete d[c];continue}
      R.m.sort((p,q)=>(p.j||0)-(q.j||0));R.chat.sort((p,q)=>(p.at||0)-(q.at||0));R.chat=R.chat.slice(-60);
      if(!R.h)R.h=R.m[0].u}
    if(cj(d)===cj(_last))return false;
    _last=JSON.parse(JSON.stringify(d));
    localStorage.setItem('bs_rooms',JSON.stringify(d));
    return true;
  }catch(e){return false}
}
function pushRooms(v){
  if(!SERVER)return;
  v=v||{};const me=(typeof S!=='undefined'&&S)?S.user:null,ops=[];
  const put=(key,c,obj)=>{const body=JSON.stringify({code:c,data:JSON.stringify(obj)});
    if(_ids[key])ops.push(_ids[key].then(id=>fetch(SERVER+'/'+id,{method:'PUT',headers:_H,body})));
    else{const p=fetch(SERVER,{method:'POST',headers:_H,body}).then(r=>r.json()).then(x=>x.id);_ids[key]=p;ops.push(p)}};
  const del=key=>{if(_ids[key]){const p=_ids[key];delete _ids[key];ops.push(p.then(id=>fetch(SERVER+'/'+id,{method:'DELETE'})))}};
  if(me){
    for(const c in v){const R=v[c],L=_last[c]||{m:[],chat:[]};
      if(!_last[c]||R.h!==L.h||R.loc!==L.loc||R.lid!==L.lid)put(c+'|r',c,{k:'r',h:R.h,loc:R.loc,lid:R.lid});
      const mine=R.m.find(x=>x.u==me),lm=L.m.find(x=>x.u==me);
      if(mine&&cj(mine)!==cj(lm))put(c+'|m|'+me,c,{k:'m',u:me,d:mine});
      const mc=(R.chat||[]).filter(x=>x.u==me).slice(-20),lc=(L.chat||[]).filter(x=>x.u==me).slice(-20);
      if(mc.length&&cj(mc)!==cj(lc))put(c+'|c|'+me,c,{k:'c',u:me,msgs:mc});
    }
    for(const c in _last){const L=_last[c],R=v[c];
      if(!R){del(c+'|m|'+me);del(c+'|c|'+me);if(!L.m.some(x=>x.u!=me))del(c+'|r');continue}
      if(!R.m.some(x=>x.u==me)&&L.m.some(x=>x.u==me)){del(c+'|m|'+me);del(c+'|c|'+me)}
    }
  }
  _last=JSON.parse(JSON.stringify(v));
  _busy++;Promise.allSettled(ops).finally(()=>_busy--);
}
const _lsSet=LS.set;
LS.set=function(k,v){
  if(k==='bs_rooms')for(const c in v||{})(v[c].m||[]).forEach(x=>{if(!x.j)x.j=Date.now()});
  _lsSet.call(LS,k,v);if(k==='bs_rooms')pushRooms(v)};
setInterval(async()=>{
  if(await pull()&&typeof S!=='undefined'&&S){if(tab=='rooms'||tab=='home')render()}
},3000);
/* ===== END SHARED SERVER ===== */
const HAIR=['Bob','Long','Spiky','Bun'],ACC=['None','Glasses','Bow','Cap'],HC=['#5a3b2a','#2b2118','#c98f4a','#d98ca0','#7a8fb8'],OC=['#9caf88','#e8b4b8','#c9a27a','#8aa6c1','#b79ad0'],SK=['#f6d5b8','#e3b48c','#c68e64','#8d5a3c'];
const COST={acc1:30,acc2:30,acc3:40,oc3:50,oc4:50,hc3:25,hc4:25};
const LOC=[
{id:'cafe',n:'Rainy café',d:'Windows streaked with rain, hot coffee, soft jazz hum.',sky:'linear-gradient(#7f8fa0,#b9a38c)',fl:'#8b5e3c',fx:'rain',it:[['🪟',20,30],['🪟',50,30],['☕',30,62],['🪑',60,66],['🥐',80,58],['🪴',90,40]],n0:'rain'},
{id:'lib',n:'Warm library',d:'Tall bookshelves, brass lamps, silent desks.',sky:'linear-gradient(#5b3d2a,#8a5d3d)',fl:'#6b4630',fx:'dust',it:[['📚',15,35],['📚',40,35],['📚',65,35],['🕯️',85,45],['📖',30,66],['🪑',70,68]],n0:'hush'},
{id:'bed',n:'Bedroom corner',d:'Fairy lights, a tidy desk and a night window.',sky:'linear-gradient(#1f2447,#3a3466)',fl:'#5b4a6b',fx:'ff',it:[['🌙',80,22],['💡',20,18],['💡',45,14],['💡',70,18],['💻',35,60],['🧸',85,70],['🛏️',15,68]],n0:'night'},
{id:'zen',n:'Garden pond',d:'Koi pond, maple leaves and a stone lantern.',sky:'linear-gradient(#bfe0d0,#e8f2dc)',fl:'#7f9a6a',fx:'ff',it:[['⛩️',50,32],['🍁',15,40],['🐟',70,72],['🪷',62,64],['🏮',88,50],['🌿',30,70]],n0:'garden'},
{id:'uni',n:'University library',d:'Long study tables and a modern lounge.',sky:'linear-gradient(#cfd8dc,#eceff1)',fl:'#a69884',fx:'none',it:[['🏛️',20,30],['📚',50,30],['🖥️',30,62],['🛋️',75,64],['🪟',85,28]],n0:'hush'},
{id:'beach',n:'Sunset beach',d:'Slow waves and an orange sky.',sky:'linear-gradient(#f4a77a,#f7d6a8)',fl:'#efd9a8',fx:'wave',it:[['☀️',75,22],['🌴',12,40],['⛱️',45,60],['🐚',85,78],['📓',55,70]],n0:'ocean'},
{id:'plant',n:'Greenhouse café',d:'Sunlit plants, wooden tables and warm coffee.',sky:'',fl:'#8b6a45',fx:'none',it:[],n0:'garden'}];
let S=null,tab='home',T={mode:'focus',left:1500,end:0,run:false},ln=null,au=null;
const ACH=[['First focus','Finish one focus session',s=>s.sessions>=1],['Task master','Complete 3 tasks',s=>s.done>=3],['Level 3','Reach level 3',s=>lv(s).l>=3],['On a roll','3-day streak',s=>s.streak>=3],['Marathon','Study 300 minutes total',s=>tot(s)>=300]];
const day=(o=0)=>{const d=new Date();d.setDate(d.getDate()-o);return d.toISOString().slice(0,10)};
const tot=s=>Object.values(s.hist).reduce((a,b)=>a+b,0);
const lv=s=>{let l=1,x=s.xp;while(x>=l*100){x-=l*100;l++}return{l,x,n:l*100}};
const save=()=>{const u=LS.get('bs_users')||{};u[S.user].data=S;LS.set('bs_users',u)};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('s');setTimeout(()=>t.classList.remove('s'),2200)}
const UN=/^[A-Za-z0-9@_]{9,24}$/,PW=/^[A-Za-z0-9]{7,32}$/;
const PAL={cafe:['#6f8696','#a89684','#2f4a3a','#3d5c45','#8a6a4c','#a8553f','#ffd98a'],lib:['#3b2a22','#7a5236','#2a3a2c','#35483a','#6b4630','#8b3d2f','#ffc766'],bed:['#1b1f45','#3d3568','#232b4a','#2d3560','#4a3d63','#6a4a7a','#ffe29a'],zen:['#b8dcc9','#eaf3d6','#4f7f55','#6b9a63','#a67b55','#8f4a3a','#ffeaa8'],uni:['#c5d3dc','#eceff1','#5d7f63','#78967a','#9a8f80','#7a5c4c','#fff1b8'],beach:['#f08f66','#f8d7a6','#3f6b55','#4f7e62','#b9825a','#c4513a','#ffe0a0']};
function art(p){const[a,b,t,u,w,r,g]=p;let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="q" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="800" height="450" fill="url(#q)"/>`;
for(let i=0;i<10;i++)s+=`<circle cx="${i*90}" cy="${140+i%3*25}" r="${85+i%4*10}" fill="${t}"/>`;
s+=`<rect y="330" width="800" height="120" fill="#1c1a18" opacity=".55"/><rect x="80" y="190" width="240" height="150" fill="${w}"/><path d="M60 195L200 130L340 195z" fill="${r}"/>`;
for(let i=0;i<3;i++)s+=`<rect x="${105+i*70}" y="225" width="52" height="62" rx="4" fill="${g}"/>`;
s+=`<rect x="440" y="260" width="230" height="80" rx="14" fill="${r}"/>`;
for(let i=0;i<4;i++)s+=`<rect x="${458+i*52}" y="275" width="38" height="32" rx="3" fill="${g}" opacity=".85"/>`;
for(let i=0;i<8;i++)s+=`<circle cx="${i*115}" cy="${375+i%2*20}" r="${42+i%3*8}" fill="${u}"/>`;
s+=`<rect y="385" width="800" height="65" fill="${g}" opacity=".16"/></svg>`;
return`url('data:image/svg+xml,${encodeURIComponent(s).replace(/'/g,'%27')}')`}
function paint(){document.body.className='bg-'+(ln?ln.id:'start');document.body.style.backgroundAttachment='fixed'}
function landing(){paint();R.innerHTML=`<main style="margin:auto;max-width:520px;min-height:100vh;display:flex;align-items:center"><div class="card" style="text-align:center;width:100%;padding:32px"><p class="mu">Welcome to this website</p><h1 style="font-size:40px;color:var(--ac)">BEOMII-SEAN</h1><p>A cozy place to study, one calm room at a time.</p><p class="mu">Got a friend’s room code? Log in, then enter it under “Join a friend’s room”.</p><button class="btn" style="font-size:18px;padding:12px 28px" onclick="begin()">Start focus</button></div></main>`}
function begin(){const c=LS.get('bs_cur'),u=LS.get('bs_users')||{};c&&u[c]?start(c):auth()}
function hash(s){let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return h.toString(36)}
function avatar(c,name,mini,pose){const h=c.hc,k=c.skin,hs=c.hair;
let back=hs==1?`<rect x="14" y="22" width="32" height="38" rx="14" fill="${h}"/>`:'';
let top=hs==2?`<path d="M16 24l4-12 6 8 4-10 6 10 6-8 2 12z" fill="${h}"/>`:hs==3?`<circle cx="30" cy="8" r="7" fill="${h}"/><path d="M17 26a13 13 0 0126 0z" fill="${h}"/>`:`<path d="M16 28a14 14 0 0128 0c-6-4-22-4-28 0z" fill="${h}"/>`;
let ac=c.acc==1?'<g fill="none" stroke="#3b2a20" stroke-width="1.5"><circle cx="24" cy="30" r="4"/><circle cx="36" cy="30" r="4"/><path d="M28 30h4"/></g>':c.acc==2?`<path d="M30 17l-8-4v8zM30 17l8-4v8z" fill="#e87c95"/>`:c.acc==3?`<path d="M15 24a15 12 0 0130 0z" fill="#6b4630"/><rect x="30" y="22" width="20" height="4" rx="2" fill="#6b4630"/>`:'';
return`<div class="av" style="position:static;transform:none;width:${mini?44:56}px"><svg viewBox="0 0 60 90">${back}${pose?sitBody(c,pose):`<rect x="17" y="50" width="26" height="30" rx="9" fill="${c.outfit}"/><rect x="20" y="78" width="7" height="10" rx="3" fill="#5a4636"/><rect x="33" y="78" width="7" height="10" rx="3" fill="#5a4636"/>`}<circle cx="30" cy="34" r="14" fill="${k}"/>${top}<circle cx="25" cy="35" r="1.6" fill="#3b2a20"/><circle cx="35" cy="35" r="1.6" fill="#3b2a20"/><path d="M26 41q4 3 8 0" stroke="#a5614b" fill="none" stroke-width="1.4"/><circle cx="21" cy="40" r="2.5" fill="#e8a5a5" opacity=".6"/><circle cx="39" cy="40" r="2.5" fill="#e8a5a5" opacity=".6"/>${ac}</svg></div>`}
function scene(l,sm,live){let f='';
if(l.fx=='rain')for(let i=0;i<(sm?14:40);i++)f+=`<i class="fx rain" style="left:${Math.random()*100}%;top:-20px;animation-delay:${Math.random()}s;animation-duration:${.6+Math.random()*.5}s"></i>`;
if(l.fx=='ff'||l.fx=='dust')for(let i=0;i<14;i++)f+=`<i class="fx ff" style="left:${Math.random()*100}%;top:${10+Math.random()*60}%;animation-delay:${Math.random()*2}s"></i>`;

function sound(on){try{if(au){au.c.close();au=null}if(!on||S.mute)return;

const brown=k=='brown'||k=='ocean'||k=='fire'||k=='auto';let p=0;
for(let i=0;i<len;i++){const w=Math.random()*2-1;if(brown){p=(p+.02*w)/1.02;d[i]=p*3.5}else d[i]=w*.6}
if(k=='fire')for(let i=0;i<len-200;i++)if(Math.random()<.0004)for(let j=0;j<150;j++)d[i+j]+=(Math.random()*2-1)*(1-j/150)*.8;
const s=c.createBufferSource();s.buffer=b;s.loop=true;const g=c.createGain();g.gain.value=S.vol;const f=c.createBiquadFilter(),m=c.createGain();
if(k=='rain'){f.type='bandpass';f.frequency.value=3000;f.Q.value=.35;m.gain.value=.9}
else if(k=='ocean'){f.type='lowpass';f.frequency.value=650;m.gain.value=.5;const o=c.createOscillator(),od=c.createGain();o.frequency.value=.11;od.gain.value=.35;o.connect(od);od.connect(m.gain);o.start()}
else if(k=='white'){f.type='lowpass';f.frequency.value=9000;m.gain.value=.5}
else if(k=='fan'){f.type='bandpass';f.frequency.value=450;f.Q.value=.6;m.gain.value=1.2}
else if(k=='fire'){f.type='lowpass';f.frequency.value=900;m.gain.value=.9}
else if(k=='brown'){f.type='lowpass';f.frequency.value=1500;m.gain.value=1}
else{f.type='lowpass';f.frequency.value={rain:2500,ocean:500,garden:1200,night:300,hush:200}[ln.n0]||400;m.gain.value=1}
s.connect(f);f.connect(m);m.connect(g);g.connect(c.destination);s.start();au={c,g}}catch(e){}}

const SND=[['auto','Auto'],['rain','Rain'],['ocean','Ocean'],['brown','Brown noise'],['white','White noise'],['fan','Fan'],['fire','Fireplace']];
function setSnd(k){S.snd=k;S.mute=false;save();sound(true);render()}
function musicCard(){return`<div class="card"><b>Study sounds</b><p class="mu">Pick a background noise to help you focus. It plays on your device only.</p><div class="row" style="margin:8px 0">${SND.map(x=>`<span class="opt ${(S.snd||'auto')==x[0]&&!S.mute&&au?'on':''}" onclick="setSnd('${x[0]}')">${x[1]}</span>`).join('')}</div><div class="row"><label style="flex:1">Volume<input type="range" min="0" max="100" value="${Math.round(S.vol*100)}" oninput="S.vol=this.value/100;if(au)au.g.gain.value=S.vol;save()"></label><button class="btn alt" onclick="S.mute=true;save();sound(false);render()">Stop sound</button></div></div>`}
function others(l){const m=myroom();if(!m)return'';let k=0;return m[1].m.filter(x=>x.u!=S.user).map(x=>{k++;const sit=x.s&&SEAT[l.id],left=sit?Math.min(92,SEAT[l.id][0]+14*k):(x.x!=null?x.x:30+k*18),top=sit?SEAT[l.id][1]:(x.y!=null?x.y:82);return`<div class="av ${sit?'sit':''}" style="left:${left}%;top:${top}%">${avatar(x.ch,'',0,sit?SEAT[l.id][2]:'')}<span class="tag">${esc(x.u)}</span></div>`}).join('')}
function syncMe(){const m=myroom();if(!m||!S)return;const me=m[1].m.find(x=>x.u==S.user);if(!me)return;const sit=sitting()?1:0,x=Math.round(S.px!=null?S.px:50),y=Math.round(S.py!=null?S.py:82),ch=JSON.stringify(S.ch);
if(me.s===sit&&me.x===x&&me.y===y&&JSON.stringify(me.ch)===ch)return;
const rs=LS.get('bs_rooms'),mm=rs[m[0]].m.find(z=>z.u==S.user);mm.s=sit;mm.x=x;mm.y=y;mm.ch=S.ch;LS.set('bs_rooms',rs)}
let chatSnap=null,chatCode='';
function chatMsgs(){const m=myroom();if(!m){chatSnap=null;chatCode='';return null}if(chatCode!=m[0]||chatSnap===null){chatCode=m[0];chatSnap=(m[1].chat||[]).slice()}return chatSnap}
async function chatRefresh(){await pull();const m=myroom();if(m){chatSnap=(m[1].chat||[]).slice();chatCode=m[0]}if(S)render()}
function chatCard(){const ms=chatMsgs();return`<div class="card"><div class="row" style="justify-content:space-between"><b>Room chat</b><button class="btn alt" onclick="chatRefresh()">Refresh</button></div><p class="mu" style="margin:4px 0 0">Updates when a focus session ends, when you send, or when you tap Refresh.</p><div id="clog" class="clog">${ms?(ms.length?ms.map(x=>`<div><b>${esc(x.u)}</b> ${esc(x.t)}</div>`).join(''):'<p class="mu">No messages yet. Say hi!</p>'):'<p class="mu">Join or create a study room to chat with your friends.</p>'}</div><div class="row"><input id="cm" maxlength="200" placeholder="Message..." style="flex:1" onkeydown="if(event.key==='Enter')chatSend()"><button class="btn" onclick="chatSend()">Send</button></div></div>`}
function chatSend(){const i=$('#cm'),t=i.value.trim();if(!t)return;const m=myroom();if(!m)return toast('Join or create a room first.');const rs=LS.get('bs_rooms'),r=rs[m[0]];r.chat=(r.chat||[]).concat([{u:S.user,t:t.slice(0,200),at:Date.now()}]).slice(-60);LS.set('bs_rooms',rs);chatSnap=r.chat.slice();chatCode=m[0];i.value='';render()}
const TIPS=['Drink some water','Stretch your neck and shoulders','Look at something far away for 20 seconds','Stand up and walk around a little','Take a few slow, deep breaths'];
function showBreak(){hideBreak();const d=document.createElement('div');d.id='brk';d.innerHTML=`<div class="phone"><div class="notch"></div><div class="scr"><div id="bclk" style="font-size:14px"></div><div style="font-size:44px">&#128241;</div><div><h3>Break time</h3><div class="bt2" id="bt">${fmt(T.left)}</div></div><p style="margin:0">${TIPS[Math.floor(Math.random()*TIPS.length)]}</p><div class="brow"><button class="btn" onclick="skipBreak()">Skip break</button><button class="btn alt" onclick="hideBreak()">Close</button></div></div></div>`;document.body.appendChild(d)}
function hideBreak(){const d=$('#brk');if(d)d.remove()}
function skipBreak(){hideBreak();T.run=false;T.mode='focus';T.left=S.focus*60;render()}
setInterval(()=>{const b=$('#bt');if(b){b.textContent=fmt(T.left);const k=$('#bclk');if(k)k.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});if(!(T.run&&T.mode=='break'))hideBreak()}},500);
setInterval(()=>{if(!S||!T.run||T.mode!='break')return;const m=$('#me');if(!m)return;const x=15+Math.random()*70,y=62+Math.random()*28;m.classList.add('w');m.style.left=x+'%';m.style.top=y+'%';S.px=x;S.py=y;setTimeout(()=>{m.classList.remove('w');try{syncMe()}catch(e){}},1300)},3500);
const _render=render;
render=function(){const a=document.activeElement,id=a&&a.id,v=a&&a.value,ss=a&&a.selectionStart;_render();
if(id==='cm'){const n=$('#cm');if(n){n.value=v;n.focus();try{n.setSelectionRange(ss,ss)}catch(e){}}}
const lg=$('#clog');if(lg)lg.scrollTop=lg.scrollHeight;try{syncMe()}catch(e){}};

landing();
